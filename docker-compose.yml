version: '3.8'

services:
  ro-customer-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ro-customer-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      # Mount SSL certificates if needed
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - ro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ro-network:
    driver: bridge
